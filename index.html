<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Snake 3 — Neon Run</title>
  <style>
    :root{--bg:#000;--panel:#090b10;--line:#1b2230;--mint:#2fe6a6;--violet:#8b5cff;--text:#fff;--muted:#8d96a8;--danger:#ff4d6d}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,Manrope,system-ui,-apple-system,sans-serif;touch-action:none}
    body{display:grid;place-items:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
    .app{width:min(100%,520px);height:min(100%,900px);display:grid;grid-template-rows:auto 1fr auto;gap:14px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:10px}.mark{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--mint),var(--violet));box-shadow:0 0 32px rgba(47,230,166,.25)}
    h1{font-size:16px;margin:0;letter-spacing:.12em}.sub{font-size:11px;color:var(--muted);margin-top:3px}
    .stats{display:flex;gap:8px}.stat{min-width:74px;padding:8px 11px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.035)}
    .label{font-size:9px;color:var(--muted);letter-spacing:.12em}.value{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
    .stage{position:relative;display:grid;place-items:center;min-height:0;border:1px solid var(--line);border-radius:28px;background:radial-gradient(circle at 50% 20%,rgba(139,92,255,.12),transparent 42%),var(--panel);overflow:hidden;box-shadow:0 25px 80px rgba(0,0,0,.55)}
    canvas{display:block;width:min(100%,78vh);height:auto;aspect-ratio:1/1;touch-action:none}
    .scan{position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 49%,rgba(255,255,255,.018) 50%);background-size:100% 4px;mix-blend-mode:screen}
    .overlay{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.72);backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:.2s}
    .overlay.show{opacity:1;pointer-events:auto}.card{text-align:center;max-width:320px}.eyebrow{font-size:11px;color:var(--mint);letter-spacing:.18em;font-weight:800}.title{font-size:34px;line-height:1;margin:12px 0}.copy{font-size:14px;line-height:1.5;color:var(--muted);margin-bottom:20px}
    button{border:0;border-radius:999px;padding:14px 24px;font:inherit;font-weight:800;color:#000;background:linear-gradient(135deg,var(--mint),#8ef6d0);cursor:pointer;min-width:180px;box-shadow:0 12px 40px rgba(47,230,166,.2)}
    .footer{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px}.pill{border:1px solid var(--line);border-radius:999px;padding:8px 12px}.accent{color:var(--mint)}
    @media(max-height:700px){.app{gap:8px}.stage{border-radius:20px}.footer{display:none}.stat{padding:6px 9px}.value{font-size:17px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><div class="mark"></div><div><h1>SNAKE 3</h1><div class="sub">NEON SURVIVAL RUN</div></div></div>
      <div class="stats"><div class="stat"><div class="label">SCORE</div><div class="value" id="score">0</div></div><div class="stat"><div class="label">BEST</div><div class="value" id="best">0</div></div></div>
    </header>
    <section class="stage" id="stage">
      <canvas id="game" width="600" height="600" aria-label="Игровое поле Snake 3"></canvas>
      <div class="scan"></div>
      <div class="overlay show" id="overlay"><div class="card"><div class="eyebrow" id="eyebrow">READY</div><div class="title" id="overlayTitle">Snake 3</div><div class="copy" id="overlayCopy">Собирай энергию, избегай красных импульсов и не врезайся в себя.</div><button id="action">НАЧАТЬ</button></div></div>
    </section>
    <footer class="footer"><span class="pill">Свайп · стрелки · WASD</span><span>Пауза: <span class="accent">P / двойной тап</span></span></footer>
  </main>
<script>
'use strict';
const $=s=>document.querySelector(s);
class Snake3{
  constructor(){
    this.canvas=$('#game');this.ctx=this.canvas.getContext('2d');this.scoreEl=$('#score');this.bestEl=$('#best');this.overlay=$('#overlay');this.title=$('#overlayTitle');this.copy=$('#overlayCopy');this.eyebrow=$('#eyebrow');this.action=$('#action');this.stage=$('#stage');
    this.grid=24;this.cell=this.canvas.width/this.grid;this.best=Number(localStorage.getItem('snake3.best')||0);this.bestEl.textContent=this.best;this.timer=null;this.running=false;this.paused=false;this.lastTap=0;this.touch=null;
    this.bind();this.reset();this.draw();this.action.onclick=()=>this.start();
    document.addEventListener('visibilitychange',()=>{if(document.hidden&&this.running&&!this.paused)this.pause();});
    if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
  reset(){this.snake=[{x:8,y:12},{x:7,y:12},{x:6,y:12}];this.dir={x:1,y:0};this.next={x:1,y:0};this.score=0;this.speed=155;this.dead=false;this.placeFood();this.placeHazard();this.updateStats();}
  start(){clearTimeout(this.timer);this.reset();this.running=true;this.paused=false;this.overlay.classList.remove('show');this.tick();this.haptic('light');}
  pause(){if(!this.running||this.dead)return;this.paused=!this.paused;if(this.paused){clearTimeout(this.timer);this.show('PAUSED','Пауза','Продолжи, когда будешь готов.','ПРОДОЛЖИТЬ',()=>this.pause());}else{this.overlay.classList.remove('show');this.tick();}}
  gameOver(){this.dead=true;this.running=false;clearTimeout(this.timer);if(this.score>this.best){this.best=this.score;localStorage.setItem('snake3.best',String(this.best));this.bestEl.textContent=this.best;}this.haptic('error');this.show('RUN ENDED','Игра окончена',`Счёт: ${this.score}. Лучший результат: ${this.best}.`,'ЕЩЁ РАЗ',()=>this.start());}
  show(eyebrow,title,copy,button,handler){this.eyebrow.textContent=eyebrow;this.title.textContent=title;this.copy.textContent=copy;this.action.textContent=button;this.action.onclick=handler;this.overlay.classList.add('show');}
  placeFood(){this.food=this.randomFree([]);}
  placeHazard(){this.hazard=this.randomFree([this.food]);}
  randomFree(extra){let p;do{p={x:Math.floor(Math.random()*this.grid),y:Math.floor(Math.random()*this.grid)};}while(this.snake.some(s=>s.x===p.x&&s.y===p.y)||extra.some(s=>s&&s.x===p.x&&s.y===p.y));return p;}
  setDirection(x,y){if(this.dir.x===-x&&this.dir.y===-y)return;this.next={x,y};}
  step(){this.dir=this.next;const head={x:(this.snake[0].x+this.dir.x+this.grid)%this.grid,y:(this.snake[0].y+this.dir.y+this.grid)%this.grid};if(this.snake.some(s=>s.x===head.x&&s.y===head.y))return this.gameOver();this.snake.unshift(head);
    if(head.x===this.food.x&&head.y===this.food.y){this.score++;this.speed=Math.max(72,155-this.score*3);this.placeFood();if(this.score%4===0)this.placeHazard();this.haptic('light');}
    else if(head.x===this.hazard.x&&head.y===this.hazard.y){this.score=Math.max(0,this.score-2);while(this.snake.length>3&&this.snake.length>Math.max(3,this.score+3))this.snake.pop();this.placeHazard();this.haptic('error');this.snake.pop();}
    else this.snake.pop();this.updateStats();}
  tick(){if(!this.running||this.paused||this.dead)return;this.step();this.draw();this.timer=setTimeout(()=>this.tick(),this.speed);}
  updateStats(){this.scoreEl.textContent=this.score;}
  draw(){const c=this.ctx,w=this.canvas.width,h=this.canvas.height;c.clearRect(0,0,w,h);c.fillStyle='#07090d';c.fillRect(0,0,w,h);c.strokeStyle='rgba(255,255,255,.045)';c.lineWidth=1;for(let i=0;i<=this.grid;i++){const p=i*this.cell;c.beginPath();c.moveTo(p,0);c.lineTo(p,h);c.stroke();c.beginPath();c.moveTo(0,p);c.lineTo(w,p);c.stroke();}
    this.glowCell(this.food,'#2fe6a6',.28);this.glowCell(this.hazard,'#ff4d6d',.22);
    this.snake.forEach((s,i)=>{const pad=i?4:2;const x=s.x*this.cell+pad,y=s.y*this.cell+pad,size=this.cell-pad*2;c.fillStyle=i?`rgba(47,230,166,${Math.max(.28,1-i/this.snake.length*.65)})`:'#ffffff';c.shadowColor=i?'#2fe6a6':'#8b5cff';c.shadowBlur=i?10:18;c.beginPath();c.roundRect(x,y,size,size,i?7:10);c.fill();c.shadowBlur=0;});}
  glowCell(p,color,alpha){const c=this.ctx,x=p.x*this.cell+this.cell/2,y=p.y*this.cell+this.cell/2;c.shadowColor=color;c.shadowBlur=28;c.fillStyle=color;c.beginPath();c.arc(x,y,this.cell*.24,0,Math.PI*2);c.fill();c.shadowBlur=0;c.fillStyle=`rgba(255,255,255,${alpha})`;c.beginPath();c.arc(x-this.cell*.07,y-this.cell*.07,this.cell*.06,0,Math.PI*2);c.fill();}
  bind(){document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d','p',' '].includes(k))e.preventDefault();if(k==='arrowup'||k==='w')this.setDirection(0,-1);if(k==='arrowdown'||k==='s')this.setDirection(0,1);if(k==='arrowleft'||k==='a')this.setDirection(-1,0);if(k==='arrowright'||k==='d')this.setDirection(1,0);if(k==='p'||k===' ')this.pause();});
    this.stage.addEventListener('touchstart',e=>{const t=e.touches[0];this.touch={x:t.clientX,y:t.clientY,time:Date.now()};},{passive:true});
    this.stage.addEventListener('touchend',e=>{if(!this.touch)return;const t=e.changedTouches[0],dx=t.clientX-this.touch.x,dy=t.clientY-this.touch.y,dist=Math.max(Math.abs(dx),Math.abs(dy)),now=Date.now();if(dist>24){Math.abs(dx)>Math.abs(dy)?this.setDirection(dx>0?1:-1,0):this.setDirection(0,dy>0?1:-1);}else if(now-this.lastTap<300)this.pause();this.lastTap=now;this.touch=null;},{passive:true});}
  haptic(type){try{const tg=window.Telegram?.WebApp?.HapticFeedback;if(tg){type==='error'?tg.notificationOccurred('error'):tg.impactOccurred('light');}else if(navigator.vibrate)navigator.vibrate(type==='error'?[40,40,60]:20);}catch{}}
}
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);return this;};}
window.addEventListener('load',()=>new Snake3());
</script>
</body>
</html>
